# CodeQL — GitHub's free static analysis (SAST). Scans the Python backend and
# the TypeScript/JavaScript frontend for security issues and reports them in the
# Security › Code scanning tab. Also satisfies the OpenSSF static-analysis
# criterion and the Scorecard "SAST" check.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '30 7 * * 1' # weekly, Monday 07:30 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to write analysis results to the code-scanning dashboard.
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # No compilation step needed for interpreted languages.
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Every github/codeql-action/* step MUST be pinned to the SAME SHA. Dependabot
      # bumped init (and scorecard's upload-sarif) to this version but left analyze
      # behind, so init wrote a config for the newer action while analyze ran the
      # older one ("Loaded a configuration file for version 4.37.3, but running
      # version 4.37.1"). Keep them in lockstep.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v3
        with:
          category: "/language:${{ matrix.language }}"
