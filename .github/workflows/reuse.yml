# REUSE compliance — verifies every file has machine-readable copyright and
# licensing information (https://reuse.software). Keeps the "REUSE compliant"
# badge honest. Runs the linter via pip so no extra third-party action is needed.
name: REUSE compliance

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install REUSE tool
        run: python -m pip install reuse
      - name: Check REUSE compliance
        run: reuse lint
