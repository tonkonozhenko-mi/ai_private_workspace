# CodeQL — GitHub's free static analysis (SAST). Scans the Python backend and
# the TypeScript/JavaScript frontend for security issues and reports them in the
# Security › Code scanning tab. Also satisfies the OpenSSF static-analysis
# criterion and the Scorecard "SAST" check.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '30 7 * * 1' # weekly, Monday 07:30 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to write analysis results to the code-scanning dashboard.
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # No compilation step needed for interpreted languages.
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use the CodeQL bundle linked to this pinned action version for the
          # whole job. Without this, `init` picks up whatever newer CodeQL the
          # runner's toolcache ships (e.g. 4.37.3) and writes a config for it,
          # while `analyze` runs the action's own linked version (4.37.1) — and
          # the two disagree ("Loaded a configuration file for version X, but
          # running version Y"). Pinning to `linked` keeps both on one version.
          # (Durable fix: bump the pinned action SHA; v3 is being deprecated.)
          tools: linked

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v3
        with:
          category: "/language:${{ matrix.language }}"
