name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege by default; jobs only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # Cheapest possible gate: does every file parse, on the Python we target?
      # It runs after setup-python above, so it uses that interpreter and not
      # whatever the runner shipped — which matters, because the source uses
      # PEP 758 (`except A, B:` without parentheses, Python 3.14+). Compiling it
      # with an older interpreter reports a SyntaxError in every such file and
      # looks exactly like catastrophic corruption. It isn't; the version is
      # simply wrong. If this step fails, check the Python version first.
      - name: Backend syntax check
        run: python -m compileall -q backend/app backend/tests

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Run backend tests
        run: |
          cd backend
          pytest -q --junitxml=test-results.xml
      - name: Publish test summary
        if: always()
        run: python scripts/ci_test_summary.py backend/test-results.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm run typecheck
          npm run build

      # The pure-helper suite was never gated here, so when its runner broke on a
      # clean install nothing said so — 84 tests sat green-by-absence. Gate it.
      - name: Frontend lib tests
        run: |
          cd frontend
          npm run test:lib

  lint:
    name: Backend lint (advisory)
    runs-on: ubuntu-latest
    # Advisory while the lint baseline is being cleaned up: surfaces issues on
    # PRs without blocking merges. Set this to false to make lint required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff lint
        run: ruff check backend
      - name: Ruff format check
        run: ruff format --check backend

  release-audit:
    name: Release candidate audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Run release audit
        run: ./scripts/audit_release_candidate.sh
